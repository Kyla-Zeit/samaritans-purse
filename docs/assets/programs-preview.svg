<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f5f0e7"/><text x="700" y="95" text-anchor="middle" fill="#c99b6b" font-family="Arial" font-weight="700" font-size="19" letter-spacing="4">OUR MINISTRY</text><text x="700" y="155" text-anchor="middle" fill="#243a48" font-family="Georgia" font-weight="700" font-size="52">Serving in <tspan fill="#315f49">His Name</tspan></text><rect x="665" y="180" width="70" height="5" rx="2" fill="#c99b6b"/>
<g font-family="Arial"><g transform="translate(90,245)"><rect width="580" height="250" rx="18" fill="#fffaf3" stroke="#ded6ca"/><rect width="580" height="108" rx="18" fill="#315f49"/><text x="28" y="70" fill="#fff" font-family="Georgia" font-size="31" font-weight="700">International Crisis Response</text><text x="28" y="150" fill="#4d5b62" font-size="18">Emergency food, shelter, medical support,</text><text x="28" y="178" fill="#4d5b62" font-size="18">water solutions, and church partnerships.</text><text x="28" y="220" fill="#c18852" font-size="15" font-style="italic">We go to help people in Jesus' Name.</text></g>
<g transform="translate(730,245)"><rect width="580" height="250" rx="18" fill="#fffaf3" stroke="#ded6ca"/><rect width="580" height="108" rx="18" fill="#b88455"/><text x="28" y="70" fill="#fff" font-family="Georgia" font-size="31" font-weight="700">Operation Christmas Child</text><text x="28" y="150" fill="#4d5b62" font-size="18">Shoebox gifts distributed through local churches,</text><text x="28" y="178" fill="#4d5b62" font-size="18">with Gospel outreach and discipleship.</text><text x="28" y="220" fill="#c18852" font-size="15" font-style="italic">Every good and perfect gift is from above.</text></g>
<g transform="translate(90,545)"><rect width="580" height="250" rx="18" fill="#fffaf3" stroke="#ded6ca"/><rect width="580" height="108" rx="18" fill="#527b70"/><text x="28" y="70" fill="#fff" font-family="Georgia" font-size="31" font-weight="700">Water Projects</text><text x="28" y="150" fill="#4d5b62" font-size="18">Wells, filters, reservoirs, sanitation support,</text><text x="28" y="178" fill="#4d5b62" font-size="18">and hygiene education.</text><text x="28" y="220" fill="#c18852" font-size="15" font-style="italic">Whoever drinks the water I give them...</text></g>
<g transform="translate(730,545)"><rect width="580" height="250" rx="18" fill="#fffaf3" stroke="#ded6ca"/><rect width="580" height="108" rx="18" fill="#8a654d"/><text x="28" y="70" fill="#fff" font-family="Georgia" font-size="31" font-weight="700">Canadian Disaster Relief</text><text x="28" y="150" fill="#4d5b62" font-size="18">Response to floods, wildfires, storms,</text><text x="28" y="178" fill="#4d5b62" font-size="18">and other disasters across Canada.</text><text x="28" y="220" fill="#c18852" font-size="15" font-style="italic">Carry each other's burdens.</text></g></g></svg>