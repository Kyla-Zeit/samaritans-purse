<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fffaf3"/><text x="700" y="100" text-anchor="middle" fill="#c99b6b" font-family="Arial" font-weight="700" font-size="19" letter-spacing="4">CURRENT RESPONSES</text><text x="700" y="160" text-anchor="middle" fill="#243a48" font-family="Georgia" font-weight="700" font-size="52">Responding to Urgent <tspan fill="#315f49">Needs Today</tspan></text><rect x="665" y="184" width="70" height="5" rx="2" fill="#c99b6b"/><g font-family="Arial"><g transform="translate(90,255)"><rect width="580" height="245" rx="18" fill="#f5f0e7"/><circle cx="65" cy="65" r="31" fill="#dbe8df"/><text x="65" y="74" text-anchor="middle" fill="#315f49" font-size="28">♥</text><text x="115" y="62" fill="#243a48" font-family="Georgia" font-weight="700" font-size="30">Gaza Response</text><text x="42" y="125" fill="#65716f" font-size="18">Food and medical help delivered through trusted</text><text x="42" y="153" fill="#65716f" font-size="18">partners with focus on vulnerable families.</text><rect x="42" y="185" width="145" height="42" rx="8" fill="none" stroke="#315f49"/><text x="114" y="212" text-anchor="middle" fill="#315f49" font-size="16" font-weight="700">View Response</text></g><g transform="translate(730,255)"><rect width="580" height="245" rx="18" fill="#f5f0e7"/><circle cx="65" cy="65" r="31" fill="#dbe8df"/><text x="65" y="74" text-anchor="middle" fill="#315f49" font-size="26">✦</text><text x="115" y="62" fill="#243a48" font-family="Georgia" font-weight="700" font-size="30">Ukraine Response</text><text x="42" y="125" fill="#65716f" font-size="18">Practical relief including meals, firewood, and</text><text x="42" y="153" fill="#65716f" font-size="18">support for families facing ongoing hardship.</text><rect x="42" y="185" width="125" height="42" rx="8" fill="none" stroke="#315f49"/><text x="104" y="212" text-anchor="middle" fill="#315f49" font-size="16" font-weight="700">See Update</text></g><g transform="translate(90,555)"><rect width="580" height="245" rx="18" fill="#f5f0e7"/><circle cx="65" cy="65" r="31" fill="#f0dfd2"/><text x="65" y="74" text-anchor="middle" fill="#a65d3c" font-size="27">▲</text><text x="115" y="62" fill="#243a48" font-family="Georgia" font-weight="700" font-size="29">Canadian Wildfire Response</text><text x="42" y="125" fill="#65716f" font-size="18">Disaster relief teams support affected communities</text><text x="42" y="153" fill="#65716f" font-size="18">with practical help and encouragement.</text></g><g transform="translate(730,555)"><rect width="580" height="245" rx="18" fill="#f5f0e7"/><circle cx="65" cy="65" r="31" fill="#dce6e7"/><text x="65" y="74" text-anchor="middle" fill="#315f49" font-size="25">✈</text><text x="115" y="62" fill="#243a48" font-family="Georgia" font-weight="700" font-size="28">B.C. Flood Response</text><text x="42" y="125" fill="#65716f" font-size="18">Recovery support for residents affected by historic</text><text x="42" y="153" fill="#65716f" font-size="18">flooding and community recovery needs.</text></g></g></svg>